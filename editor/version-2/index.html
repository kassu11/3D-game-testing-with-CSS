<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Camera using three levels of nesting</title>
    <link rel="stylesheet" href="./index.css" />
  </head>
  <body>
    <div id="wrapper">
      <div class="info-wrapper">
        <h1>Gravity testint 02</h1>
        <p>Add gravity</p>
        <p id="pos"></p>
        <p id="y-force"></p>
        <p id="fps"></p>
      </div>
      <svg id="hoverRect">
        <polygon />
      </svg>
      <div id="crosshair"></div>
    </div>
    <div id="viewport">
      <div id="camera">
        <div class="tile" style="pointer-events: none; transform: translate3d(-500px, 100px, -500px) rotateX(90deg); background: repeating-conic-gradient(black 0deg, black 25%, transparent 0deg, transparent 50%) 50% center / 100px 100px, linear-gradient( 90deg, rgb(255, 0, 0) 0%, rgb(255, 154, 0) 10%, rgb(208, 222, 33) 20%, rgb(79, 220, 74) 30%, rgb(63, 218, 216) 40%, rgb(47, 201, 226) 50%, rgb(28, 127, 238) 60%, rgb(95, 21, 242) 70%, rgb(186, 12, 248) 80%, rgb(251, 7, 217) 90%, rgb(255, 0, 0) 100%); width: 4000px; height: 4000px;"></div>
        <div class="tile hitbox" style="background: linear-gradient(to right, rgb(51, 51, 51), gray); width: 100px; height: 100px"></div>
      </div>
    </div>
  </body>
</html>

<script src="./index.js" type="module"></script>
